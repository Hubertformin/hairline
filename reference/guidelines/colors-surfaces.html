<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces and lines" subtitle="Paper, two greys, the desk, two line weights" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-sans);padding:20px 22px;height:170px;box-sizing:border-box}
.lab{font:var(--type-label-s);letter-spacing:var(--track-label);color:var(--ink-4);text-transform:uppercase}
.mono{font:var(--type-data-s);color:var(--ink-3)}
.sw{border-radius:12px;height:56px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:14px;align-items:flex-end}</style></head><body><div class="grid" style="grid-template-columns:repeat(6,1fr)"><div>
    <div class="sw" style="background:#FFFFFF"></div>
    <div style="margin-top:8px" class="lab">paper</div>
    <div style="margin-top:3px" class="mono">#FFFFFF</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">boards</div>
  </div><div>
    <div class="sw" style="background:#F7F8F9"></div>
    <div style="margin-top:8px" class="lab">surface-2</div>
    <div style="margin-top:3px" class="mono">#F7F8F9</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">tiles, fields</div>
  </div><div>
    <div class="sw" style="background:#F2F3F5"></div>
    <div style="margin-top:8px" class="lab">surface-3</div>
    <div style="margin-top:3px" class="mono">#F2F3F5</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">quiet buttons</div>
  </div><div>
    <div class="sw" style="background:#EDEEF0"></div>
    <div style="margin-top:8px" class="lab">desk</div>
    <div style="margin-top:3px" class="mono">#EDEEF0</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">behind boards</div>
  </div><div>
    <div class="sw" style="background:#F0F1F3"></div>
    <div style="margin-top:8px" class="lab">line-1</div>
    <div style="margin-top:3px" class="mono">#F0F1F3</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">row hairline</div>
  </div><div>
    <div class="sw" style="background:#E4E6EA"></div>
    <div style="margin-top:8px" class="lab">line-2</div>
    <div style="margin-top:3px" class="mono">#E4E6EA</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">header rule</div>
  </div></div></body></html>
