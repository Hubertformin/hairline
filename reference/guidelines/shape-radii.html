<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-sans);padding:20px 22px;height:170px;box-sizing:border-box}
.lab{font:var(--type-label-s);letter-spacing:var(--track-label);color:var(--ink-4);text-transform:uppercase}
.mono{font:var(--type-data-s);color:var(--ink-3)}
.sw{border-radius:12px;height:56px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:14px;align-items:flex-end}</style></head><body>
<div class="row" style="gap:16px">
<div style="flex:1;text-align:center">
    <div style="height:36px;background:var(--surface-2);border-radius:99px"></div>
    <div style="margin-top:9px" class="lab">pill</div>
    <div style="margin-top:3px" class="mono">99px</div></div><div style="flex:1;text-align:center">
    <div style="height:56px;background:var(--surface-2);border-radius:14px"></div>
    <div style="margin-top:9px" class="lab">field</div>
    <div style="margin-top:3px" class="mono">14px</div></div><div style="flex:1;text-align:center">
    <div style="height:56px;background:var(--surface-2);border-radius:12px"></div>
    <div style="margin-top:9px" class="lab">chip</div>
    <div style="margin-top:3px" class="mono">12px</div></div><div style="flex:1;text-align:center">
    <div style="height:72px;background:var(--surface-2);border-radius:20px"></div>
    <div style="margin-top:9px" class="lab">tile</div>
    <div style="margin-top:3px" class="mono">20px</div></div><div style="flex:1;text-align:center">
    <div style="height:72px;background:var(--surface-2);border-radius:22px"></div>
    <div style="margin-top:9px" class="lab">board</div>
    <div style="margin-top:3px" class="mono">22px</div></div>
</div></body></html>
