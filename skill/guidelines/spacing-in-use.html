<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing in use" subtitle="Label 10–14 above its value, 20 between tiles, hairlines for rows" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-sans);padding:20px 22px;height:200px;box-sizing:border-box}
.lab{font:var(--type-label-s);letter-spacing:var(--track-label);color:var(--ink-4);text-transform:uppercase}
.mono{font:var(--type-data-s);color:var(--ink-3)}
.sw{border-radius:12px;height:56px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:14px;align-items:flex-end}</style></head><body>
<div style="display:flex;gap:20px">
  <div style="flex:1;background:var(--surface-2);border-radius:var(--r-card);padding:22px 24px">
    <div class="lab">MONEY IN, MARCH</div>
    <div style="margin-top:12px;font:500 26px var(--font-sans);letter-spacing:-.025em;color:var(--ink-1)">570 000</div>
    <div style="margin-top:10px;font:var(--type-caption);color:var(--ink-3)">Salary 450 000 · freelance 120 000</div>
  </div>
  <div style="flex:1;background:var(--surface-2);border-radius:var(--r-card);padding:22px 24px">
    <div class="lab">STILL TO PAY</div>
    <div style="margin-top:12px;font:500 26px var(--font-sans);letter-spacing:-.025em;color:var(--ink-1)">410 000</div>
    <div style="margin-top:14px;height:8px;border-radius:99px;background:var(--line-2);overflow:hidden"><span style="display:block;width:62%;height:8px;background:var(--ink-1);border-radius:99px"></span></div>
  </div>
</div></body></html>
