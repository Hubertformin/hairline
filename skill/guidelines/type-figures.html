<!-- @dsCard group="Type" viewport="700x230" name="Figures" subtitle="Schibsted Grotesk, weight 500, tracking −0.03em, tabular" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-sans);padding:20px 22px;height:230px;box-sizing:border-box}
.lab{font:var(--type-label-s);letter-spacing:var(--track-label);color:var(--ink-4);text-transform:uppercase}
.mono{font:var(--type-data-s);color:var(--ink-3)}
.sw{border-radius:12px;height:56px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:14px;align-items:flex-end}</style></head><body>
<div style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:baseline;gap:18px">
    <span style="font:500 46px/1 var(--font-sans);letter-spacing:-.03em;color:var(--ink-1);font-variant-numeric:tabular-nums slashed-zero">227 400</span>
    <span class="mono">figure-xl · 46px</span></div><div style="display:flex;align-items:baseline;gap:18px">
    <span style="font:500 38px/1 var(--font-sans);letter-spacing:-.03em;color:var(--ink-1);font-variant-numeric:tabular-nums slashed-zero">880 900</span>
    <span class="mono">figure-l · 38px</span></div><div style="display:flex;align-items:baseline;gap:18px">
    <span style="font:500 30px/1 var(--font-sans);letter-spacing:-.03em;color:var(--ink-1);font-variant-numeric:tabular-nums slashed-zero">−12 600</span>
    <span class="mono">figure-m · 30px</span></div><div style="display:flex;align-items:baseline;gap:18px">
    <span style="font:500 24px/1 var(--font-sans);letter-spacing:-.03em;color:var(--ink-1);font-variant-numeric:tabular-nums slashed-zero">61/100</span>
    <span class="mono">figure-s · 24px</span></div>
</div></body></html>
