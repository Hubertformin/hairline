<!-- @dsCard group="Type" viewport="700x180" name="Data figures" subtitle="Mono, tabular, slashed zero, right aligned in tables" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-sans);padding:20px 22px;height:180px;box-sizing:border-box}
.lab{font:var(--type-label-s);letter-spacing:var(--track-label);color:var(--ink-4);text-transform:uppercase}
.mono{font:var(--type-data-s);color:var(--ink-3)}
.sw{border-radius:12px;height:56px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:14px;align-items:flex-end}</style></head><body>
<div style="max-width:420px">
<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-1)">
      <span style="font:400 13px var(--font-sans);color:var(--ink-1)">Salary</span>
      <span style="font:var(--type-data);color:var(--ink-3);font-variant-numeric:tabular-nums slashed-zero">450 000</span></div><div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-1)">
      <span style="font:400 13px var(--font-sans);color:var(--ink-1)">School fees</span>
      <span style="font:var(--type-data);color:var(--alarm);font-weight:500;font-variant-numeric:tabular-nums slashed-zero">360 000</span></div><div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-1)">
      <span style="font:400 13px var(--font-sans);color:var(--ink-1)">Support mum</span>
      <span style="font:var(--type-data);color:var(--ink-3);text-decoration:line-through;font-variant-numeric:tabular-nums slashed-zero">0</span></div><div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-1)">
      <span style="font:400 13px var(--font-sans);color:var(--ink-1)">Closing cash</span>
      <span style="font:var(--type-data);color:var(--ink-1);font-variant-numeric:tabular-nums slashed-zero">102 400</span></div>
</div></body></html>
