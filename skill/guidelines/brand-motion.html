<!-- @dsCard group="Brand" viewport="700x150" name="Motion and states" subtitle="140–260ms ease; colour and opacity only; selection dims siblings" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-sans);padding:20px 22px;height:150px;box-sizing:border-box}
.lab{font:var(--type-label-s);letter-spacing:var(--track-label);color:var(--ink-4);text-transform:uppercase}
.mono{font:var(--type-data-s);color:var(--ink-3)}
.sw{border-radius:12px;height:56px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:14px;align-items:flex-end}</style></head><body>
<div style="display:flex;gap:26px;align-items:center">
  <div><div class="lab">HOVER</div><div style="margin-top:10px;display:flex;gap:8px">
    <span style="height:34px;padding:0 14px;display:inline-flex;align-items:center;border-radius:99px;background:var(--surface-3);font:500 12px var(--font-sans);color:var(--ink-1)">rest</span>
    <span style="height:34px;padding:0 14px;display:inline-flex;align-items:center;border-radius:99px;background:var(--line-2);font:500 12px var(--font-sans);color:var(--ink-1)">hover</span></div></div>
  <div><div class="lab">FOCUS</div><div style="margin-top:10px;height:34px;padding:0 14px;display:flex;align-items:center;border-radius:var(--r-field);background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--ink-1);font:400 13px var(--font-sans);color:var(--ink-1)">250 000</div></div>
  <div><div class="lab">DIMMED SIBLING</div><div style="margin-top:10px;display:flex;gap:6px;align-items:center">
    <span style="width:70px;height:10px;border-radius:99px;background:var(--a-blue)"></span>
    <span style="width:70px;height:10px;border-radius:99px;background:var(--a-blue);opacity:.16"></span></div></div>
</div></body></html>
