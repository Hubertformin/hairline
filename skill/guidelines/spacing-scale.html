<!-- @dsCard group="Spacing" viewport="700x160" name="Scale" subtitle="4 → 40, with 20 between tiles and 26 between columns" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-sans);padding:20px 22px;height:160px;box-sizing:border-box}
.lab{font:var(--type-label-s);letter-spacing:var(--track-label);color:var(--ink-4);text-transform:uppercase}
.mono{font:var(--type-data-s);color:var(--ink-3)}
.sw{border-radius:12px;height:56px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:14px;align-items:flex-end}</style></head><body>
<div style="display:flex;align-items:flex-end;gap:10px">
<div style="text-align:center">
  <div style="width:4px;height:4px;background:var(--ink-1);border-radius:3px;margin:0 auto"></div>
