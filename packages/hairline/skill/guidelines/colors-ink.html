<!-- @dsCard group="Colors" viewport="700x170" name="Ink" subtitle="Four steps of text. Meaning never goes lighter than ink-3." -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-sans);padding:20px 22px;height:170px;box-sizing:border-box}
.lab{font:var(--type-label-s);letter-spacing:var(--track-label);color:var(--ink-4);text-transform:uppercase}
.mono{font:var(--type-data-s);color:var(--ink-3)}
.sw{border-radius:12px;height:56px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:14px;align-items:flex-end}</style></head><body><div class="grid" style="grid-template-columns:repeat(4,1fr)"><div>
    <div class="sw" style="background:#111214"></div>
    <div style="margin-top:8px" class="lab">ink-1</div>
    <div style="margin-top:3px" class="mono">#111214</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">figures, titles</div>
  </div><div>
    <div class="sw" style="background:#42454D"></div>
    <div style="margin-top:8px" class="lab">ink-2</div>
    <div style="margin-top:3px" class="mono">#42454D</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">body copy</div>
  </div><div>
    <div class="sw" style="background:#6E7178"></div>
    <div style="margin-top:8px" class="lab">ink-3</div>
    <div style="margin-top:3px" class="mono">#6E7178</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">labels, demoted values</div>
  </div><div>
    <div class="sw" style="background:#8E9099"></div>
    <div style="margin-top:8px" class="lab">ink-4</div>
    <div style="margin-top:3px" class="mono">#8E9099</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">placeholders, chrome</div>
  </div></div></body></html>
