<!-- @dsCard group="Colors" viewport="700x180" name="Semantic pairs" subtitle="Each state is an ink on its own wash — they always travel together" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-sans);padding:20px 22px;height:180px;box-sizing:border-box}
.lab{font:var(--type-label-s);letter-spacing:var(--track-label);color:var(--ink-4);text-transform:uppercase}
.mono{font:var(--type-data-s);color:var(--ink-3)}
.sw{border-radius:12px;height:56px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:14px;align-items:flex-end}</style></head><body>
<div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div>
    <div style="background:#FBF0F3;border-radius:12px;padding:14px 16px">
      <div style="font:500 9px var(--font-mono);letter-spacing:.12em;color:#D22B4A;text-transform:uppercase">alarm</div>
      <div style="margin-top:10px;font:500 20px var(--font-sans);color:#D22B4A;letter-spacing:-.02em">360 000</div>
    </div>
    <div style="margin-top:8px" class="mono">#D22B4A / #FBF0F3</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">late right now</div>
  </div><div>
    <div style="background:#EAF6E7;border-radius:12px;padding:14px 16px">
      <div style="font:500 9px var(--font-mono);letter-spacing:.12em;color:#3D7A2A;text-transform:uppercase">positive</div>
      <div style="margin-top:10px;font:500 20px var(--font-sans);color:#3D7A2A;letter-spacing:-.02em">360 000</div>
    </div>
    <div style="margin-top:8px" class="mono">#3D7A2A / #EAF6E7</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">settled, in use</div>
  </div><div>
    <div style="background:#F1F4FE;border-radius:12px;padding:14px 16px">
      <div style="font:500 9px var(--font-mono);letter-spacing:.12em;color:#2E4CB8;text-transform:uppercase">info</div>
      <div style="margin-top:10px;font:500 20px var(--font-sans);color:#2E4CB8;letter-spacing:-.02em">360 000</div>
    </div>
    <div style="margin-top:8px" class="mono">#2E4CB8 / #F1F4FE</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">projected, explanatory</div>
  </div><div>
    <div style="background:#FFF6E0;border-radius:12px;padding:14px 16px">
      <div style="font:500 9px var(--font-mono);letter-spacing:.12em;color:#8A6A16;text-transform:uppercase">caution</div>
      <div style="margin-top:10px;font:500 20px var(--font-sans);color:#8A6A16;letter-spacing:-.02em">360 000</div>
    </div>
    <div style="margin-top:8px" class="mono">#8A6A16 / #FFF6E0</div>
    <div style="margin-top:3px;font:var(--type-caption);color:var(--ink-4)">waiting for you</div>
  </div>
</div></body></html>
