<!-- @dsCard group="Brand" viewport="700x190" name="Elevation" subtitle="Raised for tiles, float for the assistant bar, modal for dialogs. No borders." -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-sans);padding:20px 22px;height:190px;box-sizing:border-box}
.lab{font:var(--type-label-s);letter-spacing:var(--track-label);color:var(--ink-4);text-transform:uppercase}
.mono{font:var(--type-data-s);color:var(--ink-3)}
.sw{border-radius:12px;height:56px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:14px;align-items:flex-end}</style></head><body>
<div class="row" style="gap:20px;align-items:stretch">
<div style="flex:1">
    <div style="height:74px;background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow-raised)"></div>
    <div style="margin-top:12px" class="lab">raised</div>
    <div style="margin-top:4px;font:var(--type-caption);color:var(--ink-4)">tiles on paper</div></div><div style="flex:1">
    <div style="height:74px;background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow-float)"></div>
    <div style="margin-top:12px" class="lab">float</div>
    <div style="margin-top:4px;font:var(--type-caption);color:var(--ink-4)">the floating bar</div></div><div style="flex:1">
    <div style="height:74px;background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow-modal)"></div>
    <div style="margin-top:12px" class="lab">modal</div>
    <div style="margin-top:4px;font:var(--type-caption);color:var(--ink-4)">dialogs over a scrim</div></div>
</div></body></html>
